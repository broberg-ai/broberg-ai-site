name: CI — kvalitetsport (Gate A + B)

# F162: Enhver ændring skal passere kvalitetsporten før den må deployes.
# Rød port = STOP → tilbage til udvikling til den er grøn. Ingen naked cutover.
#
#   Gate B (pre-deploy): ingen NY hardcodet, ikke-CMS-redigerbar tekst i src/.
#   Gate A (post-deploy): hvert renderet CMS-felt MED indhold SKAL være inline-redigerbart
#                         (F086 baseline: nye ikke-wirede felter fejler porten → rød på main).
#
# Kræver @webhouse/cms-cli >= 0.4.22 (coverage --baseline + check-text).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Kvalitetsport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Gate B — ingen ny hardcodet tekst uden for CMS
        run: bun run gate:text

      - name: Gate C — nye interaktive elementer skal have data-testid (Lens-anker)
        run: bun run gate:testids

  deploy:
    name: Deploy (kun efter grøn port)
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-broberg-ai
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy til Fly
        # --local-only: byg imaget på runneren (Docker er præinstalleret) og push
        # til app-registry. Undgår org-scoped remote builder → deploy-token forbliver
        # snævert app-scoped (mindst privilegium).
        run: flyctl deploy --local-only -a broberg-ai --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  coverage:
    name: Gate A — inline-edit-dækning (post-deploy)
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # computeCoverage er ren jsdom — vi behøver ikke playwrights browsere.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      # sleep 10 var et GAET, og gaettet var forkert: 31/8-2026 naaede porten at
      # maale den FORRIGE udgave, fandt 0 gaps og meldte groent — mens den nye
      # side havde 4. En port der kan maale den forkerte udgave er ikke en port.
      # Nu venter vi paa at /healthz svarer med PRAECIS denne commit.
      - name: Vent på at NETOP denne commit er live
        run: |
          # TRE UDFALD, TRE BESKEDER. buddy's tilføjelse (intercom #24393), og
          # den er rigtig: «feltet mangler» må ALDRIG læses som «passer ikke
          # endnu, prøv igen» — så venter porten på en maskine der aldrig KAN
          # svare, og timeout ligner et fejlet deploy i stedet for en for gammel
          # app. To forskellige fejl skal have to forskellige beskeder.
          #
          # Men vi fejler ikke STRAKS på et manglende felt, som buddy foreslog:
          # under selve udrulningen svarer den GAMLE maskine stadig, og på den
          # allerførste deploy der indfører sha'en har den gamle per definition
          # ikke feltet. Fejl-straks ville gøre netop dén deploy umulig.
          # Vi venter derfor, men HUSKER hvad vi så, og siger det ved timeout.
          sidst_set=""
          saa_nogensinde_sha=0
          for i in $(seq 1 60); do
            svar=$(curl -fsS --max-time 10 https://broberg.ai/healthz || true)
            live=$(printf '%s' "$svar" | jq -r '.sha // empty' 2>/dev/null || true)
            [ -n "$live" ] && saa_nogensinde_sha=1
            if [ "$live" = "${{ github.sha }}" ]; then echo "live: $live"; exit 0; fi
            sidst_set="${live:-<intet sha-felt>}"
            echo "  ($i/60) live=$sidst_set — venter på ${{ github.sha }}"
            sleep 5
          done
          if [ "$saa_nogensinde_sha" = "0" ]; then
            echo "::error::/healthz svarede aldrig med et sha-felt. Appen er for gammel til at melde sin egen version — porten kan derfor ikke vide HVILKEN udgave den ville måle. Deployet kan sagtens være lykkedes; det er rapporteringen der mangler."
          else
            echo "::error::Den nye udgave blev aldrig live (sidst set: $sidst_set, ventede på ${{ github.sha }}). Porten ville ellers have målt den forrige udgave."
          fi
          exit 1
      # A.1 — content-scan (side-niveau): AL synlig tekst i <main> skal ligge i et
      # [data-cms-field]. 0 gaps krævet. Fanger tekst en besøgende faktisk ser som
      # ikke er redigerbar (finere end schema-gaten, som er collection-niveau union).
      - name: Gate A.1 — synligt indhold redigerbart (0 gaps)
        run: bun run gate:editable
      # A.2 — schema-coverage (F086 no-new-gaps): hvert rendret CMS-felt målt mod
      # skema + baseline. Fanger et NYT skemafelt der renderes uden wiring.
      - name: Gate A.2 — hvert CMS-felt med indhold er redigerbart (no-new-gaps)
        run: bun run gate:coverage
